# vigilant-web-haven — gerado por deploy/install.sh
# Painel (arquivos estáticos do React)
server {
    listen 80;
    server_name __PAINEL_DOMAIN__;
    root __INSTALL_DIR__/painel;
    index index.html;

    location /downloads/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API (Supabase): só as rotas usadas pelo painel e pelos agentes.
# O Studio (painel do banco) fica fora da internet: use túnel SSH para 127.0.0.1:__API_LOCAL_PORT__.
map $http_upgrade $vigilant_connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    server_name __API_DOMAIN__;
    client_max_body_size 100m;

    location ~ ^/(auth|rest|storage|functions|realtime|graphql)/v1/ {
        proxy_pass http://127.0.0.1:__API_LOCAL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vigilant_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / {
        return 404;
    }
}
